# Veröffentlicht die Seite auf GitHub Pages:
#   main -> https://www.discgolf-game.de/        (live)
#   dev  -> https://www.discgolf-game.de/dev/    (Vorschau zum Testen vor dem Release)
#   dev-graphic -> https://www.discgolf-game.de/dev-graphic/  (Vorschau des Grafik-Updates)
# Voraussetzung: Settings -> Pages -> Source "GitHub Actions" und unter
# Settings -> Environments -> github-pages sind auch die Branches "dev" und "dev-graphic" erlaubt.
# Gibt es den Branch dev-graphic nicht (mehr), fällt die Vorschau einfach weg.
name: Pages (live + Vorschau)

on:
  push:
    branches: [main, dev, dev-graphic]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: main auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: dev auschecken
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - name: dev-graphic auschecken (falls vorhanden)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev-graphic
          path: dev-graphic
      - name: Seite zusammenstellen
        run: |
          kopiere() {
            mkdir -p "$2"
            for f in $(cd "$1" && ls -A | grep -vxE '\.git|\.github|server|docs|werkzeuge|tests|gba|CNAME|README\.md'); do cp -r "$1/$f" "$2/"; done
          }
          kopiere main site
          # Vorschauen: jeder Stand bekommt eigene Skript-Adressen (?v=…-<commit>), damit Handys nichts Altes mischen,
          # und keine Vorschau landet in Suchmaschinen
          vorschau() {
            [ -f "$1/index.html" ] || return 0
            kopiere "$1" "site/$1"
            sha=$(cd "$1" && git rev-parse --short HEAD)
            sed -i -E "s/\?v=([0-9.]+)\"/?v=\1-$sha\"/g" "site/$1/index.html"
            sed -i 's#<head>#<head>\n<meta name="robots" content="noindex, nofollow">#' "site/$1"/*.html
          }
          vorschau dev
          vorschau dev-graphic
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
