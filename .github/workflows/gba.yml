# Baut die GBA-Version (gba/) und prüft, dass sie zur Webversion passt.
# Die fertige ROM liegt danach unter Actions → dieser Lauf → Artifacts → boogie-garanten-gba.
name: GBA-ROM

on:
  push:
    branches: [main, dev]
    paths: ["gba/**", "tests/**", "werkzeuge/**", "portraets.js", "physik.js", "bahnen.js", "taschen.js", "index.html", ".github/workflows/gba.yml"]
  pull_request:
    paths: ["gba/**", "tests/**", "werkzeuge/**", "portraets.js", "physik.js", "bahnen.js", "taschen.js", "index.html", ".github/workflows/gba.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: Header aktuell + C++-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Erzeugte Header aktuell? (werkzeuge/exportiere_gba.mjs)
        run: node werkzeuge/exportiere_gba.mjs --pruefen
      - name: Zufall C++ = physik.js
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I gba/include tests/gba/zufall_test.cpp -o zufall_test
          ./zufall_test
      - name: Daten C++ = bahnen.js/taschen.js
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I gba/include tests/gba/daten_test.cpp -o daten_test
          ./daten_test
      - name: Physik C++ = physik.js (600 Referenzwürfe)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I gba/include -I tests/gba tests/gba/physik_test.cpp gba/src/physik.bn_iwram.cpp -o physik_test
          ./physik_test

  grafik:
    name: Bahnbilder aus der Webversion rendern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright und Pillow
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Rendern (werkzeuge/rendere_gba.mjs)
        run: node werkzeuge/rendere_gba.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bahnbilder
          path: |
            gba/graphics/bahn_*.bmp
            gba/graphics/bahn_*.json
            gba/graphics/uebersicht_*.bmp
            gba/graphics/uebersicht_*.json

  rom:
    name: ROM bauen
    needs: [pruefen, grafik]
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 git > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bahnbilder
          path: gba/graphics
      - name: Butano laden
        run: gba/hole_butano.sh
      - name: Bauen
        working-directory: gba
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j"$(nproc)"
      - name: Version im Dateinamen
        id: version
        run: |
          v=$(sed -n 's/.*BG_VERSION "\(.*\)".*/\1/p' gba/include/gen_version.h)
          echo "v=$v" >> "$GITHUB_OUTPUT"
          cp gba/boogie-garanten.gba "boogie-garanten-$v.gba"
          ls -l boogie-garanten-*.gba
      - uses: actions/upload-artifact@v4
        with:
          name: boogie-garanten-gba-${{ steps.version.outputs.v }}
          path: boogie-garanten-*.gba
      - name: Mess-ROM bauen (BG_BENCHMARK)
        working-directory: gba
        run: |
          rm -rf build
          make -j"$(nproc)" BG_EXTRA=-DBG_BENCHMARK
          mv boogie-garanten.gba ../benchmark.gba
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-rom
          path: benchmark.gba

  messen:
    name: Wurfzeit im Emulator messen (mGBA)
    needs: rom
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-rom
      - name: mGBA installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mgba-sdl xvfb > /dev/null
      - name: Messen
        run: |
          export SDL_AUDIODRIVER=dummy
          xvfb-run -a timeout 240 /usr/games/mgba -l 255 benchmark.gba > mgba.log 2>&1 || true
          grep -a "BENCH" mgba.log || { echo "Keine Messwerte – Log-Ende:"; tail -40 mgba.log; }
          {
            echo "### Wurfzeit im Emulator (mGBA)"
            echo '```'
            grep -a "BENCH" mgba.log || echo "keine Messwerte"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
