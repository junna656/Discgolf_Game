# Veröffentlicht den dev-Branch als Vorschau unter
# https://boogie-garanten-dev.boogiegaranten.workers.dev
name: Vorschau (dev) deployen

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vorschau-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          for f in $(ls -A | grep -vxE '\.git|\.github|server|vorschau|_site|CNAME|README\.md'); do cp -r "$f" _site/; done
          cp vorschau/_headers _site/_headers
      - name: Deploy zu Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vorschau
